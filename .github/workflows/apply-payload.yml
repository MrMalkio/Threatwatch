name: Apply audit remediation payload

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: threatwatch-audit-remediation
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Decode repaired repository
        shell: bash
        run: |
          set -euo pipefail
          cat payload.part-* > payload.b64
          base64 --decode payload.b64 > payload.zip
          unzip -o payload.zip -d .
          rm -f payload.b64 payload.zip payload.part-*
          rm -f .github/workflows/apply-payload.yml
          rm -f .github/workflows/test.yml
          rm -f .remediation-trigger

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify repaired build
        run: npm run check

      - name: Commit repaired repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply Threatwatch audit remediation"
          git push origin HEAD:main
