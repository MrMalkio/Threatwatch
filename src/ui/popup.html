<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Threatwatch</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body class="popup">
  <div class="row between">
    <h1>Threatwatch</h1>
    <span id="health" class="status">Loading</span>
  </div>
  <p id="domain" class="muted small"></p>
  <p id="message" class="error" role="status"></p>

  <section id="unprotected" class="card stack hidden">
    <strong>This site is not protected.</strong>
    <label>
      Mode
      <select id="new-mode">
        <option value="strict">Strict</option>
        <option value="learn">Learn</option>
        <option value="normal">Normal</option>
      </select>
    </label>
    <button id="protect" class="primary">Protect this site</button>
  </section>

  <section id="protected" class="card stack hidden">
    <div class="row between">
      <strong id="profile-label"></strong>
      <label class="checkbox-row small">
        <input id="enabled" type="checkbox">
        Enabled
      </label>
    </div>
    <label>
      Mode
      <select id="mode">
        <option value="normal">Normal</option>
        <option value="strict">Strict</option>
        <option value="learn">Learn</option>
      </select>
    </label>
    <div class="small muted"><span id="event-count">0</span> local events for this profile</div>
  </section>

  <section class="section">
    <h2>Recent events</h2>
    <div id="events" class="card"></div>
  </section>

  <div class="section row between">
    <button id="options" class="ghost">Open settings</button>
    <button id="retry" class="ghost hidden">Retry sync</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
